[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "huohuo-ai-vtuber"
version = "1.0.0"
description = "HuoHuo AI Vtuber Desktop Companion in pure Python"
authors = [{ name = "Daffa & Software Workshop" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.5.0",
    "numpy>=1.24.0",
    "pywebview>=5.0.0",
    "requests>=2.31.0",
    "supertonic @ git+https://github.com/supertone-oss-archive/supertonic-py.git@df0f9686dac7fbbde391b759e2ee5286a3737622",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "playwright>=1.40.0",
]
voice = [
    "faster-whisper>=1.0.0",
]

[project.scripts]
huohuo = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["huohuo*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-windows.yml'
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Tidak ada runtime tambahan yang perlu dipasang: server dijalankan Node
      # (saat terkemas memakai Node bawaan Electron lewat ELECTRON_RUN_AS_NODE).
      - run: npm ci
      - name: Install Electron runtime explicitly
        shell: bash
        run: node node_modules/electron/install.js
      - name: Build installer
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Silver-Wolf-Windows
          path: apps/stage-tamagotchi/release/*.exe
          if-no-files-found: error
          retention-days: 14

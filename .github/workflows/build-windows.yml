name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'sidecar/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-windows.yml'
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Sidecar Go ikut dikompilasi di runner, jadi build tidak bergantung pada
      # binary yang ter-commit.
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: npm ci
      - name: Install Electron runtime explicitly
        shell: bash
        run: node node_modules/electron/install.js
      - run: npm run typecheck
      # Menjalankan suite TypeScript (vitest) sekaligus suite Go (go test).
      - run: npm test
      - name: Build installer
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Silver-Wolf-Windows
          path: apps/stage-tamagotchi/release/*.exe
          if-no-files-found: error
          retention-days: 14

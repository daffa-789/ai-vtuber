name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit, stress & AST layer isolation (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Run non-E2E tiers
        run: uv run pytest tests --ignore=tests/e2e -q

  e2e:
    name: Playwright E2E (system Microsoft Edge, headless)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies (incl. Playwright)
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Run E2E suite
        run: uv run pytest tests/e2e -q

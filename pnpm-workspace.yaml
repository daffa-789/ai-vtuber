packages:
  - apps/*
  - packages/*

# Versi terpusat (ala `catalog:` Airi) supaya tidak ada paket yang menyimpang
# versi satu sama lain. Paket internal merujuk `workspace:*`, paket eksternal
# merujuk `catalog:`.
catalog:
  # --- bahasa & alat ---
  typescript: ^5.7.2
  vitest: ^2.1.8
  tsx: ^4.19.2
  turbo: ^2.3.3
  '@types/node': ^22.10.2

  # --- validasi & konfigurasi ---
  zod: ^3.24.1
  dotenv: ^16.4.7
  consola: ^3.4.0

  # --- frontend ---
  vue: ^3.5.13
  pinia: ^2.3.0
  vite: ^6.0.7
  '@vitejs/plugin-vue': ^5.2.1
  unocss: ^0.65.4
  happy-dom: ^15.11.7

  # --- render Live2D ---
  # pixi-live2d-display 0.4 memakai kontrak PIXI 6 (bukan 7).
  pixi.js: ^6.5.10
  'pixi-live2d-display': ^0.4.0

  # --- inferensi onnx di browser ---
  onnxruntime-web: ^1.20.1
  '@huggingface/transformers': ^4.3.0
  piper-tts-web: ^1.1.2
  '@mintplex-labs/piper-tts-web': ^1.0.5
  vite-plugin-static-copy: ^3.1.2
  rvc-onnx-web: ^1.0.0

  # --- desktop ---
  electron: ^44.5.1
  electron-vite: ^5.0.0
  electron-builder: ^26.15.3
